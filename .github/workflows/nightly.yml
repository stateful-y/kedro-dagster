name: Nightly Build

on:
  schedule:
    # Run every day at 2:30 AM UTC
    - cron: "30 2 * * *"
  workflow_dispatch: # Allow manual triggering

# Least-privilege default: read-only token; create-issue-on-failure widens to issues:write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # A nightly exists to report, not to fail fast. Cancelling the other
      # interpreters on the first failure turns one bad minute into a run that
      # says nothing about the versions it never reached.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    # Codecov upload authenticates via GitHub OIDC (tokenless) -- no stored CODECOV_TOKEN.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install nox
        # renovate: datasource=pypi depName=nox
        run: uv tool install nox==2026.8.10

      # `test_coverage` is pinned to the minimum Python, so `nox -s test_coverage`
      # runs that interpreter whatever the matrix entry says. Asking for it on every
      # entry ran the same suite once per version and exercised no other interpreter;
      # the split mirrors the full/coverage split in tests.yml.
      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: nox -s test_coverage

      - name: Run tests
        if: matrix.python-version != '3.11'
        run: nox -s test --python ${{ matrix.python-version }}

      - name: Run docstring tests
        run: nox -s test_docstrings

      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        # Gated on the entry that PRODUCES the report. This was a hardcoded '3.12'
        # while `test_coverage` is pinned to the minimum Python, so it uploaded that
        # run's coverage under a 3.12 label -- and in a project whose matrix has no
        # 3.12 entry at all it uploaded nothing, silently and forever.
        if: ${{ matrix.python-version == '3.11' }}
        with:
          use_oidc: true
          # Named explicitly, with the uploader's search off. This step had
          # neither for several releases: it uploaded whatever the fallback happened to
          # find, which is the exact pattern the tests.yml upload was fixed to remove --
          # and it survived that fix because the check only looked at tests.yml.
          files: '${{ github.workspace }}/.artifacts/coverage.xml'
          disable_search: true
          fail_ci_if_error: true

  # [ADDITION] Run versioned tests nightly
  test-versions:
    uses: ./.github/workflows/tests-versions.yml

  # The release path's tools, exercised where a failure is cheap.
  #
  # `publish-release.yml` only ever runs on a merged, `changelog`-labelled PR, so
  # nothing touches these tools until a real publish is already in flight. Three
  # defects were once found in that file at once, and one of them -- an SBOM flag
  # removed by a major version of an unpinned tool -- broke every generated
  # project's release on the day it shipped, with no change in any of them.
  #
  # Those tools are pinned now, which turns silent drift into a Renovate PR. That
  # is the fix and it creates this gap: nothing runs the SBOM step, so such a PR
  # goes green on evidence that says nothing about whether the release still
  # works. This job is what makes those PRs mean something. It builds, checks and
  # generates exactly as the release does, and publishes nothing.
  release-smoke:
    name: Release path (build + SBOM, no publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.5"

      - name: Build package
        run: uv build --python 3.11 --python-preference only-managed --sdist --wheel . --out-dir dist

      - name: Check distributions
        # renovate: datasource=pypi depName=twine
        run: uvx twine==7.0.0 check dist/*

      - name: Generate SBOM (CycloneDX)
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o sbom-requirements.txt
          # The annotation must sit directly above the line carrying the version; see
          # publish-release.yml for what happens when it does not.
          # renovate: datasource=pypi depName=cyclonedx-bom
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py requirements sbom-requirements.txt \
            --output-format JSON --output-file sbom.cdx.json

      # Producing a file is not evidence it is usable: the step that broke exited 2
      # and left nothing behind, but a step that writes an empty or malformed
      # document would pass a mere existence check.
      - name: Verify the SBOM is a valid CycloneDX document
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("sbom.cdx.json") as fh:
              doc = json.load(fh)
          assert doc.get("bomFormat") == "CycloneDX", f"not a CycloneDX document: {doc.get('bomFormat')!r}"
          assert doc.get("specVersion"), "no specVersion"
          n = len(doc.get("components") or [])
          assert n > 0, "SBOM lists no components, so it describes nothing"
          print(f"CycloneDX {doc['specVersion']}, {n} components")
          EOF

  create-issue-on-failure:
    needs: [test, test-versions, release-smoke]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create issue on failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = '🔴 Nightly build failed';
            const body = `A nightly job failed on ${{ github.sha }}.

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}

            Please investigate and fix the issue.`;

            // Check if there's already an open issue for nightly build failures
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-build-failure'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['nightly-build-failure', 'bug']
              });
            } else {
              // Add a comment to the existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Another nightly build failure occurred:\n\n${body}`
              });
            }
