name: Renovate Automerge

# Renovate cannot approve its own pull request, so a branch ruleset that requires an
# approving review blocks every unattended dependency update no matter what
# `automerge` is set to in renovate.json. This workflow supplies that approval for the
# update classes renovate.json already marked as safe to merge unattended, then hands
# the PR to GitHub's own auto-merge queue. The required status checks still gate the
# merge: auto-merge waits for them, so a red CI run means the PR sits unmerged.

on:
  pull_request:
    # `labeled` matters as much as `opened`: Renovate creates the PR first and applies
    # labels in a second API call, so the `opened` payload can arrive with an empty
    # label list and the guard below would reject a PR that is in fact eligible.
    types: [opened, reopened, synchronize, labeled]
    branches: [main]

# Least-privilege default: read-only token; the job below widens only what it needs.
permissions:
  contents: read

jobs:
  automerge:
    name: Approve and enable automerge
    # Three independent conditions, all required.
    #
    # Deliberately NOT keyed on a literal bot login. The account name is the GitHub
    # App's slug, which differs per installation: a self-hosted App shows up as
    # `<app-slug>[bot]` (this fleet's is `stateful-y-renovate[bot]`), not the
    # `renovate[bot]` of the hosted Mend app. Hardcoding either one gives a workflow
    # that passes its own syntax checks and then silently never fires.
    #
    # The `automerge` label is the authorization signal, applied on exactly the rules
    # that also set `automerge: true` and nowhere else, so major bumps and the grouped
    # runtime dependency PR carry no label and stay fully manual. Applying a label needs
    # write access, so an outside contributor cannot forge the signal, and the
    # branch-prefix and Bot-author checks keep a human PR from ever being auto-approved.
    #
    # WHERE those rules live depends on how this project is configured, and the answer
    # is not always this repository:
    #
    #   - No `renovate_preset`: they are in `.github/renovate.json` here.
    #   - A `renovate_preset` is set: `.github/renovate.json` is a four-line stub that
    #     extends the preset, and the rules are in THAT repository. Nothing in this repo
    #     mentions them.
    #
    # This comment named only the first case until the v0.42.0 fan-out, which is the
    # case that does not apply to any repository generated with a preset. Someone
    # debugging "why did nothing get approved" would have opened a file containing none
    # of the relevant configuration.
    if: >-
      github.event.pull_request.user.type == 'Bot'
      && startsWith(github.event.pull_request.head.ref, 'renovate/')
      && contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      # Read only: the guard reads the branch rules, and auto-merge is enabled with the
      # App token minted below, not with this one.
      contents: read
      # `gh pr review --approve` needs write, and the org or repository setting
      # "Allow GitHub Actions to create and approve pull requests" must be enabled
      # or this step fails with a 403.
      pull-requests: write
    steps:
      # Auto-merge only waits for checks the base branch *requires*. With none, the PR
      # is mergeable the moment it is approved, GitHub refuses to arm auto-merge
      # ("Pull request is in clean/unstable status"), and `gh pr merge --auto` falls
      # back to merging on the spot, before CI has run. That is how yohou and
      # python-package-copier merged uv bumps 13 seconds after Renovate opened them,
      # once the org ruleset stopped covering them; the concurrent runs then collided
      # ("Merge already in progress") and stranded the next PRs half-handled. So
      # nothing is approved or merged unless the base branch requires a status check,
      # from a ruleset (org or repo) or from classic branch protection.
      - name: Refuse to merge into a branch that requires no checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          rules=$(gh api "repos/$REPO/rules/branches/$BASE" --jq '[.[] | select(.type == "required_status_checks")] | length')
          classic=$(gh api "repos/$REPO/branches/$BASE" --jq '.protection.required_status_checks.contexts // [] | length')
          if [ "$rules" -eq 0 ] && [ "$classic" -eq 0 ]; then
            echo "::error::$BASE requires no status checks, so auto-merge would merge this PR before CI runs. Restore the branch ruleset (Settings > Rules, or the organization ruleset's target repositories) and re-run this job."
            exit 1
          fi

      - name: Approve the update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Idempotent: re-approving an already-approved PR is not an error, which
          # matters because `synchronize` fires again on every Renovate rebase.
          gh pr review --approve "$PR_URL" \
            --body "Approved automatically: this update is in the automerge scope set by .github/renovate.json. The required status checks still gate the merge."

      # Auto-merge is enabled as the fleet App, not as GITHUB_TOKEN, because GitHub
      # performs the eventual merge as whoever enabled it. A merge made as
      # github-actions[bot] pushes to main with GITHUB_TOKEN, and that push triggers no
      # workflow -- so drain-automerge-queue.yml never runs, and every other automerge
      # PR waits "behind" main with nothing to update it. Whether Renovate or this step
      # enabled auto-merge first was a race, which is why the queue drained on some days
      # and silently stalled on others. The App token also carries the `workflows`
      # permission that GITHUB_TOKEN lacks, which enabling auto-merge requires on a PR
      # that touches `.github/workflows/*`.
      - name: Generate a token from the fleet automation GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Hand the PR to GitHub auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Renovate's `platformAutomerge` normally does this at creation time. Doing
          # it here too covers the case where that call failed, and fails loudly if
          # the repository has "Allow auto-merge" switched off, rather than leaving
          # the PR to sit unexplained. Squash is the only merge method the ruleset
          # permits.
          gh pr merge --auto --squash "$PR_URL"
