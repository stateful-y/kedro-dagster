name: Create changelog PR

on:
  push:
    tags:
      - 'v*.*.*'

# Least-privilege default: read-only token unless a job widens it explicitly. The PR
# is opened with a GitHub App token (below), not GITHUB_TOKEN, so no job needs write.
# `pull-requests: read` is for git-cliff, which reads merged PRs to attribute entries;
# it stays on GITHUB_TOKEN rather than borrowing the App token, whose write scope this
# job needs only for opening the PR.
permissions:
  contents: read
  pull-requests: read

jobs:
  # A human creates the release tag, and that push is what triggers this workflow, so
  # no automation exists at the moment the tag comes into being: by the time anything
  # can object, the tag is already public. This job is the first automated thing to see
  # it, and it runs before the changelog pull request opens and long before anything is
  # published, so a rejected release costs a force-deleted tag rather than a withdrawn
  # artifact.
  #
  # It exists because "release tags are signed" was written in the contributing guide
  # and in the security posture, believed, and measured by nothing -- five consecutive
  # releases of the template that generates this workflow carried no signature at all
  # and no one found out until someone went looking. A control nothing measures is a
  # claim, so this is deliberately the cheapest possible job: no checkout, no actions,
  # no third party in the release path.
  verify-tag-signature:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the release tag carries a verifiable signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Read from the environment, never through an Actions expression: those are
          # substituted into the script body before bash parses it, and a tag name is
          # attacker-influenced text.
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          # A lightweight tag is a ref pointing straight at a commit, with no tag object
          # to carry a signature. Report it separately from an unsigned annotated tag,
          # because "you forgot -s" and "you forgot -a" read identically in the failure
          # and are fixed the same way only by accident.
          REF=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" \
            --jq '.object.type + " " + .object.sha')
          OBJECT_TYPE="${REF%% *}"
          OBJECT_SHA="${REF##* }"

          if [ "$OBJECT_TYPE" != "tag" ]; then
            echo "::error::${TAG_NAME} is a lightweight tag, so there is no tag object to sign." \
              "Delete it (git push --delete origin ${TAG_NAME}) and recreate it with" \
              "'git tag -s ${TAG_NAME} -m \"Release ${TAG_NAME}\"'."
            exit 1
          fi

          # Ask the forge whether the signature verifies, rather than grepping the tag
          # body for a PGP block. A malformed or unknown-key signature contains the
          # block and proves nothing, so a grep would be a check that passes on exactly
          # the input it exists to reject.
          TAG_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJECT_SHA}")
          VERIFIED=$(printf '%s' "$TAG_JSON" | jq -r '.verification.verified')
          REASON=$(printf '%s' "$TAG_JSON" | jq -r '.verification.reason')

          if [ "$VERIFIED" != "true" ]; then
            echo "::error::${TAG_NAME} has no verifiable signature (reason: ${REASON})." \
              "Sign release tags with 'git tag -s', and make sure the public half of the" \
              "signing key is registered on the tagger's account so the signature can be" \
              "checked by someone who is not you. See the release section of the" \
              "contributing guide."
            exit 1
          fi

          echo "${TAG_NAME} is signed and the signature verifies."

  changelog:
    needs: verify-tag-signature
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived, scoped token from the fleet automation GitHub App. A PR
      # opened with the default GITHUB_TOKEN does not trigger CI or the label-gated
      # publish, so the automation needs a distinct identity; the App token gives it
      # one without a long-lived personal access token.
      - name: Generate a token from the fleet automation GitHub App
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          # renovate: datasource=github-releases depName=orhun/git-cliff
          tool: git-cliff@2.13.1

      - name: Generate changelog
        id: changelog
        env:
          # `.git-cliff.toml` sets `[remote.github]`, so git-cliff calls the GitHub API
          # to attach PR links and @usernames to each entry. Without a token those calls
          # are anonymous, and anonymous means 60 requests/hour shared across every job
          # on the runner's IP -- so this step used to succeed or 403 depending on who
          # else was building at the time. git-cliff panics on that 403 (exit 101) rather
          # than falling back to plain entries, which turned a rate limit into a failed
          # release. Authenticated, the ceiling is 5000/hour and the flake goes away.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the tag name
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          # Generate changelog for this release only
          RELEASE_NOTES=$(git-cliff --config .git-cliff.toml --latest --strip header)

          # Prepend new release to existing CHANGELOG.md without regenerating entire file
          git-cliff --config .git-cliff.toml --latest --prepend CHANGELOG.md

          # Save release notes to output and file
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "version=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.3"

      - name: Run hooks on generated CHANGELOG
        run: |
          # Format the generated file. `uv run --locked` keeps prek at the version in
          # uv.lock -- `uvx prek` would float, and the builtins' implementations come
          # from prek itself, so an unpinned runner means unpinned formatting.
          uv run --locked prek run --files CHANGELOG.md && rc=0 || rc=$?
          # Exit 1 means a hook rewrote CHANGELOG.md, which is exactly what this step is
          # for -- the next step commits the result. Exit 2+ means prek could not run at
          # all (an unparseable config, say). The `|| true` this replaces swallowed both,
          # so a runner that never executed looked identical to a clean format.
          if [ "$rc" -gt 1 ]; then
            echo "::error::prek failed to run (exit $rc) -- CHANGELOG.md was not formatted"
            exit "$rc"
          fi

      - name: Create Pull Request for CHANGELOG
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            CHANGELOG.md
          commit-message: "chore(release): update CHANGELOG.md for ${{ steps.changelog.outputs.version }}"
          title: "chore(release): update CHANGELOG.md for ${{ steps.changelog.outputs.version }}"
          body: |
            Automated CHANGELOG.md update for release ${{ steps.changelog.outputs.version }}

            Generated by git-cliff from conventional commits.

            This PR was automatically created by the release workflow.
          branch: changelog-${{ steps.changelog.outputs.version }}
          base: main
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: true
          labels: |
            changelog
            automated
