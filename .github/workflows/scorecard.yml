name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly independent grade of the repo's security posture.
    - cron: "21 4 * * 2"
  push:
    branches: [main]

# Least-privilege default: read-only token; the analysis job widens as needed.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow-level one. The two reads are what
    # OpenSSF's own example workflow asks for on a private repository; without them
    # checkout fails with "repository not found" until the repo is public.
    permissions:
      contents: read
      actions: read
      # Upload the results to the Security tab and publish to the OpenSSF API.
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ github.token }}
          # Publish results to the OpenSSF Scorecard API (public repos only).
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: results.sarif
