name: Run tests for different versions of Kedro and Dagster
on:
  workflow_call:
  # Allow manual triggering when needed
  workflow_dispatch:
  # Always run on pushes to main
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  # Run on PRs when ready for review (non-draft). We include synchronize so
  # subsequent commits also run, but gate with a job-level condition.
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

# Without this, the job inherits the repository's default token scope, which can be
# read-write. `workflow_call` also lets a caller's scope flow in, so the floor has to
# be declared here rather than assumed from whoever invokes it. Running tests reads.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Test for ${{ matrix.python-version }} | ${{ matrix.kedro_spec }} | ${{ matrix.dagster_spec }} on ${{ matrix.os }} (mlflow)
    # Only run for non-draft PRs or on non-PR events (e.g., push to main)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        kedro_spec: ["kedro>=1.0,<2.0"]
        dagster_spec: ["dagster>=1.10,<1.11", "dagster>=1.11,<1.12", "dagster>=1.12,<1.13",]
        exclude:
          - python-version: "3.14"
            dagster_spec: "dagster>=1.10,<1.11"
          - python-version: "3.14"
            dagster_spec: "dagster>=1.11,<1.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install nox
        # renovate: datasource=pypi depName=nox
        run: uv tool install --python-preference only-managed nox==2026.8.17

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install --python-preference only-managed ${{ matrix.python-version }}

      - name: Run versioned tests with mlflow
        shell: bash
        run: |
          # Parameter order must match Nox's generated session names: (with_mlflow, dagster_spec, kedro_spec)
          nox -s "test_versions-${{ matrix.python-version }}(with_mlflow=True, dagster_spec='${{ matrix.dagster_spec }}', kedro_spec='${{ matrix.kedro_spec }}')"
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: 0

  versions-passed:
    name: Versions passed
    if: always()
    needs: [versions]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the version matrix did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::the version-compatibility matrix failed or was cancelled"
          exit 1
      - name: Version matrix passed
        run: echo "All version-compatibility jobs passed or were legitimately skipped."
