name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-disclosed query pattern still runs against unchanged code.
    - cron: "27 3 * * 1"

# Least-privilege default: read-only token; the analyze job widens as needed.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      # Required to upload CodeQL results to the Security tab.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: python
          # Scopes the scan to shipped code. Without it the default suite reads test
          # assertions and example notebooks as production code paths; see the config
          # file for which queries that trips and why excluding beats dismissing.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
